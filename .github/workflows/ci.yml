name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  claudebot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  merchant:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchant
          POSTGRES_PASSWORD: merchant
          POSTGRES_DB: merchant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U merchant" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: merchant
    env:
      TEST_DATABASE_URL: postgres://merchant:merchant@localhost:5432/merchant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: merchant/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
